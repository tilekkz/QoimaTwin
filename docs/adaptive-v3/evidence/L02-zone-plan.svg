<text x="155" y="72" font-size="16">144 × 72 m floor · Y up · height envelope 8 m · 1 world unit = 1 m · proposal / VERIFY</text>
<text x="155" y="97" font-size="14" fill="#52636d">Synthetic 8 m spine/cross widths; loaded feasibility deferred. Areas are footprints, not slot capacities.</text>
