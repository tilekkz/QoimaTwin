<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
<title id="title">L02 — V3 functional zone proposal, 144 by 72 metres</title>
<desc id="desc">Scaled XZ top plan. Two west/east areas per SMALL STANDARD HEAVY LONG FLEX; finite staging; six packing stations reserved; 8 metre cross/spine and six protected approach overlays. No rack placement, service anchors or route graph.</desc>
